[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpufabric"
version = "0.1.0"
description = "Discover, access, and control GPUs across local network machines via gRPC"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "GPU Fabric Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "pynvml>=11.5.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
cupy = ["cupy-cuda12x>=13.0.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "grpcio-tools>=1.60.0",
]

[project.scripts]
gpufabric-client = "client.cli:main"
gpufabric-worker = "worker.server:run_worker"

[tool.setuptools]
packages = ["client", "worker", "common"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
