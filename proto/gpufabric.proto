syntax = "proto3";

package gpufabric;

// GPU Fabric gRPC Service definition
service GPUFabricService {
  rpc GetHealth(HealthRequest) returns (HealthResponse);
  rpc GetGPUInfo(GPUInfoRequest) returns (GPUInfoResponse);
  rpc GetGPUStatus(GPUStatusRequest) returns (GPUStatusResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // Run a tensor operation on a worker GPU.
  rpc Compute(ComputeRequest) returns (ComputeResponse);
  // List every GPU on the worker with its specs and live status.
  rpc ListGPUs(ListGPUsRequest) returns (ListGPUsResponse);
  // Run a benchmark on data generated directly on the worker GPU.
  rpc RunBenchmark(BenchmarkRequest) returns (BenchmarkResponse);
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTHY = 1;
  DEGRADED = 2;
  UNAVAILABLE = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string worker_id = 2;
  string version = 3;
  bool gpu_available = 4;
  HealthState health_state = 5;
  string hostname = 6;
  string api_version = 7;
  string cuda_version = 8;
  string driver_version = 9;
  double last_heartbeat = 10;
  string health_details = 11;
  int32 active_tasks = 12;
  int32 gpu_count = 13;
}

message GPUInfoRequest {
  int32 device_index = 1;
}

message GPUInfoResponse {
  int32 device_index = 1;
  string name = 2;
  int64 total_vram_bytes = 3;
  int64 free_vram_bytes = 4;
  int64 used_vram_bytes = 5;
  string total_vram_human = 6;
  string free_vram_human = 7;
  string used_vram_human = 8;
  string compute_capability = 9;
  string driver_version = 10;
}

message GPUStatusRequest {
  int32 device_index = 1;
}

message GPUStatusResponse {
  int32 device_index = 1;
  int32 gpu_utilization_pct = 2;
  int32 memory_utilization_pct = 3;
  int64 total_vram_bytes = 4;
  int64 free_vram_bytes = 5;
  int64 used_vram_bytes = 6;
  string free_vram_human = 7;
  string used_vram_human = 8;
  int32 temperature_c = 9;
  int32 active_tasks = 10;
  int32 power_usage_w = 11;
  int32 power_limit_w = 12;
  bool available = 13;
  string current_workload = 14;
}

enum WorkloadType {
  WORKLOAD_UNSPECIFIED = 0;
  VECTOR_ADD = 1;
}

message ExecuteRequest {
  WorkloadType workload_type = 1;
  repeated float a = 2;
  repeated float b = 3;
  int32 device_index = 4;
}

message ExecuteResponse {
  string task_id = 1;
  string workload_type = 2;
  string status = 3;
  repeated float result = 4;
  int32 result_length = 5;
  double execution_time_ms = 6;
  int32 device_index = 7;
  string gpu_backend = 8;
  string error = 9;
}

// ---------------------------------------------------------------------------
// Generic tensor compute
// ---------------------------------------------------------------------------

enum DType {
  DTYPE_UNSPECIFIED = 0;
  FLOAT32 = 1;
  FLOAT64 = 2;
}

// An n-dimensional array. `data` holds the raw little-endian values in
// row-major (C) order, so len(data) == product(shape) * itemsize(dtype).
// An empty shape is a scalar.
message Tensor {
  DType dtype = 1;
  repeated int64 shape = 2;
  bytes data = 3;
}

// Enum values share the package scope, so these are prefixed with OP_ to
// avoid clashing with WorkloadType.VECTOR_ADD.
enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OP_VECTOR_ADD = 1;   // c = a + b            a, b: [n]
  OP_VECTOR_MUL = 2;   // c = a * b            a, b: [n] (element-wise)
  OP_VECTOR_DOT = 3;   // c = sum(a * b)       a, b: [n] -> scalar
  OP_MATRIX_ADD = 4;   // C = A + B            A, B: [m, n]
  OP_MATMUL = 5;       // C = A @ B            A: [m, k], B: [k, n] -> [m, n]
  OP_TRIAD = 6;        // a = b + s * c        b, c: [n], s: scalar
}

message ComputeRequest {
  Operation op = 1;
  repeated Tensor inputs = 2;
  int32 device_index = 3;
}

message ComputeResponse {
  string task_id = 1;
  Tensor result = 2;
  double gpu_time_ms = 3;    // kernel only, measured with CUDA events
  double total_time_ms = 4;  // on the worker: host->device copy + kernel + device->host copy
  int32 device_index = 5;
}

// ---------------------------------------------------------------------------
// GPU inventory
// ---------------------------------------------------------------------------

message ListGPUsRequest {}

message GPUDevice {
  int32 device_index = 1;
  string name = 2;
  int64 total_vram_bytes = 3;
  int64 free_vram_bytes = 4;
  string compute_capability = 5;
  int32 gpu_utilization_pct = 6;
  int32 temperature_c = 7;
  int32 power_usage_w = 8;
  int32 power_limit_w = 9;
  int32 memory_utilization_pct = 10;
  bool available = 11;
  string current_workload = 12;
}

message ListGPUsResponse {
  string worker_id = 1;
  string version = 2;
  string driver_version = 3;
  // True if the worker can run Compute jobs (CuPy found a GPU). NVML can
  // see GPUs even when CuPy is missing, so this is reported separately.
  bool compute_ready = 4;
  repeated GPUDevice gpus = 5;
  HealthState health_state = 6;
  string cuda_version = 7;
  string hostname = 8;
  double last_heartbeat = 9;
}

// ---------------------------------------------------------------------------
// Benchmarks
// ---------------------------------------------------------------------------

enum Benchmark {
  BENCHMARK_UNSPECIFIED = 0;
  // STREAM triad a = b + s * c on float32 vectors of `size` elements.
  // Measures GPU memory bandwidth (3 * size * 4 bytes per run).
  BENCH_TRIAD = 1;
  // `size` x `size` float32 matrix multiply. Measures compute (2 * size^3 FLOPs).
  BENCH_MATMUL = 2;
  // Estimate pi from `size` random points per run in the unit square.
  BENCH_MONTE_CARLO_PI = 3;
}

message BenchmarkRequest {
  Benchmark benchmark = 1;
  int64 size = 2;
  int32 device_index = 3;
  int32 repeats = 4;  // timed runs after one warm-up run; 0 means 5
}

message BenchmarkResponse {
  Benchmark benchmark = 1;
  int64 size = 2;
  int32 device_index = 3;
  int32 repeats = 4;
  double best_ms = 5;              // fastest run, CUDA event timing
  double mean_ms = 6;
  double bandwidth_gb_s = 7;       // triad: bytes moved / best time (1 GB = 1e9 bytes)
  double peak_bandwidth_gb_s = 8;  // triad: theoretical peak from NVML; 0 if unknown
  double gflops = 9;               // matmul: 2 * size^3 / best time
  double pi_estimate = 10;         // monte carlo: over size * repeats points
}
